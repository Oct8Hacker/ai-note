name: ainote

services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/gateway.Dockerfile
    env_file: ../.env
    environment:
      # Defaults match internal/config; deploy/demo.env overrides them.
      RETRY_DELAYS: ${RETRY_DELAYS:-10s,30s,90s,270s}
      FAULT_STAGE_DELAY_MS: ${FAULT_STAGE_DELAY_MS:-0}
    ports:
      - "8080:8080"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: ../.env
    environment:
      # Defaults match internal/config; deploy/demo.env overrides them.
      RETRY_DELAYS: ${RETRY_DELAYS:-10s,30s,90s,270s}
      FAULT_STAGE_DELAY_MS: ${FAULT_STAGE_DELAY_MS:-0}
    deploy:
      replicas: 2
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
