name: release

# On a v* tag: publish the gateway and worker images to GitHub Container
# Registry (FR-SETUP-4) and attach a prebuilt extension zip to a GitHub
# release (FR-SETUP-5). Tags with a "-" (v1.0.0-rc1) are prereleases and do
# not move the :latest image tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ainote-${{ matrix.service }}"
          tags="$image:$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="$tags,$image:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm --prefix extension ci
      - run: npm --prefix extension test
      - run: npm --prefix extension run build
      - name: Zip extension/dist
        run: cd extension/dist && zip -r "$GITHUB_WORKSPACE/ainote-extension-$GITHUB_REF_NAME.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ainote-extension-${{ github.ref_name }}.zip

  release:
    needs: [images, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "ainote-extension-$GITHUB_REF_NAME.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $flags
